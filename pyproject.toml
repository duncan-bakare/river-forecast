[project]
name = "river-forecast"
version = "0.1.0"
requires-python = ">=3.12"
# Ingest runtime is stdlib + boto3. Transform also needs pyarrow/numpy (AWS SDK for pandas layer).

[project.optional-dependencies]
dev = ["pytest>=8", "boto3", "moto[s3]>=5", "ruff", "pandas", "pyarrow", "numpy", "duckdb", "pytz", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"analysis/*" = ["E501"]
